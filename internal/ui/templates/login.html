{{ template "base" . }}

{{ define "content" }}
<section class="orivis-login-shell">
  <div class="orivis-login-frame">
    <div class="orivis-login-head"><span class="orivis-brand-mark" aria-hidden="true">O</span><div><span class="orivis-eyebrow">{{ .Text.Auth }}</span><h1>{{ .Text.LoginHeading }}</h1><p>{{ .Text.LoginIntro }}</p></div></div>
    <div class="orivis-login-theme">{{ template "theme_switch" . }}</div>
    {{ if .Error }}<div class="orivis-login-error" role="alert">{{ .Error }}</div>{{ end }}
    <form class="orivis-login-form" method="post" action="{{ .Links.LoginSubmit }}">
      <label class="orivis-field" for="username"><span>{{ .Text.Username }}</span><input class="orivis-form-input" id="username" name="username" autocomplete="username" required autofocus></label>
      <label class="orivis-field" for="password"><span>{{ .Text.Password }}</span></label>
      <div class="orivis-password-field"><input class="orivis-form-input" id="password" name="password" type="password" autocomplete="current-password" required><button class="orivis-password-toggle" type="button" data-orivis-password-toggle data-orivis-password-show="{{ .Text.ShowPassword }}" data-orivis-password-hide="{{ .Text.HidePassword }}" aria-label="{{ .Text.ShowPassword }}" aria-pressed="false">{{ .Text.ShowPassword }}</button></div>
      <button class="orivis-button orivis-button-primary orivis-button-block" type="submit">{{ .Text.Login }}</button>
    </form>
  </div>
</section>
{{ end }}
